plugins {
    // 两个 id 都只解析、不应用，下面按 MC 版本二选一：
    //   - fabric-loom            传统插件，走 mappings + remap（≤1.21.11）
    //   - net.fabricmc.fabric-loom 新插件，从 26.1 起 MC 本身不混淆，
    //                             它直接把 disableObfuscation 打开，不再需要 mappings
    // 两者最终指向同一个实现类，不能同时应用。
    id 'fabric-loom' version '1.19.3' apply false
    id 'net.fabricmc.fabric-loom' version '1.19.3' apply false
}

// ---------------------------------------------------------------------------
// Stonecutter 会给每个「MC 版本 × 加载器」节点各应用一遍这个脚本，
// 所以这里的 project 就是某个具体版本，而不是根项目。
// ---------------------------------------------------------------------------

/** 当前节点的 MC 版本，例如 1.20.1 / 1.21.4 / 26.3 */
def mcVersion = stonecutter.current.version

/**
 * 当前节点的名字。Fabric 节点就叫 MC 版本本身（{@code 1.20.1}），
 * 其它加载器加后缀（{@code 1.20.1-neoforge}），后缀就是加载器名。
 *
 * <p>加载器专属的源码放在 {@code src/loader/<加载器>/java}，只把当前这个加进
 * 源码目录 —— 业务代码（3000 多行）在各加载器之间是同一份。</p>
 */
def nodeName = stonecutter.current.project
def loader = nodeName.contains('-') ? nodeName.substring(nodeName.indexOf('-') + 1) : 'fabric'

/** 每个版本自己的依赖版本，放在 versions/<节点>/gradle.properties */
def versionProps = new Properties()
def versionPropsFile = rootProject.file("versions/${mcVersion}/gradle.properties")
if (versionPropsFile.exists()) {
    versionPropsFile.withInputStream { versionProps.load(it) }
}

def fabricApiVersion = versionProps.getProperty('fabric_api_version')
if (fabricApiVersion == null) {
    throw new GradleException("versions/${mcVersion}/gradle.properties 缺少 fabric_api_version")
}

/** 版本专属的 loader 覆盖（26.x 需要 0.20.x），没写就用根目录那个。 */
def loaderVersion = versionProps.getProperty('loader_version') ?: project.loader_version

/**
 * 26.x 的 jar 是**不混淆**的（Mojang 从 26.1 起直接发真名，所以也不再发 mappings）。
 * 这带来两个后果：
 *   1. 不需要任何 mappings，写了反而会去拉一个不存在的文件；
 *   2. 依赖用 implementation 而不是 modImplementation —— 没有 intermediary，
 *      Loom 那一层 remap 就没有意义了。
 * 参见 FabricMC/fabric-example-mod 的 gradle.properties：minecraft_version=26.3 那套。
 */
def unobfuscated = mcVersion.startsWith('26.')

if (unobfuscated) {
    apply plugin: 'net.fabricmc.fabric-loom'
} else {
    apply plugin: 'fabric-loom'
}

// MC 1.20.5 起要求 Java 21；1.20.1~1.20.4 还是 Java 17；26.x 要求 Java 25
def javaVersion = unobfuscated ? 25
        : ((mcVersion == '1.20.1' || mcVersion == '1.20.2'
        || mcVersion == '1.20.3' || mcVersion == '1.20.4') ? 17 : 21)

// 产物名：chatping-<mod版本>-<MC版本>-<加载器>
version = "${project.mod_version}-${mcVersion}-${project.mod_loader}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// 加载器专属代码放在 platform/<加载器>/ 下，和业务代码同一个源码根 ——
// Stonecutter 只处理标准源码根里的文件，另加 srcDir 的话版本标记不会生效。
// 这里把「不是当前加载器」的目录排除掉就行。
sourceSets {
    main {
        // 只编译当前加载器那一份实现
        if (loader != 'fabric') {
            java.exclude 'dev/mewzica/chatping/platform/fabric/**'
        }
        if (loader != 'forge') {
            java.exclude 'dev/mewzica/chatping/platform/forge/**'
        }
        if (loader != 'neoforge') {
            java.exclude 'dev/mewzica/chatping/platform/neoforge/**'
        }
    }
}

repositories {
    // Fabric 的 maven：minecraft / mappings / loader / fabric-api 都在这里。
    // 本地有缓存时就算不写也能过，干净环境（CI）会直接解析失败，所以必须显式声明。
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    if (unobfuscated) {
        // 26.x 本身就不混淆，没有 mappings 可拉，也不需要 remap。
        implementation "net.fabricmc:fabric-loader:${loaderVersion}"
        implementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
    } else {
        // 其余版本统一用 Mojang 官方映射：yarn 只到 1.21.11，26.x 没有 yarn，
        // 而两套命名的类名完全不同，不可能靠 //? if 逐行切换。
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${loaderVersion}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
    }
}

processResources {
    def mixinCompat = javaVersion == 25 ? 'JAVA_25' : 'JAVA_17'
    inputs.property "version", project.mod_version
    inputs.property "minecraft_version", mcVersion
    inputs.property "java_version", javaVersion
    inputs.property "mixin_compat", mixinCompat
    filesMatching("fabric.mod.json") {
        expand "version": project.mod_version,
                "minecraft_version": mcVersion,
                "java_version": javaVersion
    }
    filesMatching("chatping.mixins.json") {
        // mixin 的 compatibilityLevel 是「能接受的最大字节码版本」，
        // 26.x 的类编到 Java 25，写 JAVA_17 会在加载阶段直接拒掉。
        expand "mixin_compat": mixinCompat
    }
}

loom {
    runs {
        server {
            runDir rootProject.file('run-server').absolutePath
        }
        client {
            runDir rootProject.file('run').absolutePath
        }
    }

}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = javaVersion
}

java {
    withSourcesJar()
    // 用工具链而不是 sourceCompatibility：Loom 的 runClient / runServer 是拿这个
    // 工具链去启动游戏进程的。不指定的话 Gradle 会用自己的 JVM（本机是 JDK 25）去跑
    // 1.20.1，Mixin 0.8.7 读不了 major version 69 的类，服务端直接崩在 Mixin 上。
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
