name: build

on:
  push:
    branches: [ main, test ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 每个 MC 版本一个 job，并行跑。fail-fast 关掉，
  # 这样一个版本炸了不影响其它版本出产物。
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc:
          - '1.20.1'
          - '1.20.2'
          - '1.20.3'
          - '1.20.4'
          - '1.20.5'
          - '1.20.6'
          - '1.21'
          - '1.21.1'
          - '1.21.2'
          - '1.21.3'
          - '1.21.4'
          - '1.21.5'
          - '1.21.6'
          - '1.21.7'
          - '1.21.8'
          - '1.21.9'
          - '1.21.10'
          - '1.21.11'
          - '26.1'
          - '26.1.1'
          - '26.1.2'
          - '26.2'
          - '26.3'

    steps:
      - uses: actions/checkout@v4

      # Loom 1.19.3 要求 JVM >= 25
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 仓库是在 Windows 上建的，可执行位有时候会丢，这里兜一下
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build ${{ matrix.mc }}
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :${{ matrix.mc }}:build --configure-on-demand --stacktrace 2>&1 | tee gradle-build.log

      # 拿不到 job 日志时，把真正的错误行打成 annotation —— annotation 是公开可读的。
      # 不要打堆栈尾巴，那全是 Gradle 内部帧，看不出问题。
      - name: Report failure
        if: steps.build.outcome == 'failure'
        run: |
          grep -nE "error:|What went wrong|Could not (resolve|find|apply)|Caused by:|> Task .* FAILED" gradle-build.log \
            | head -14 | sed 's/^/::error::/' || true
          exit 1

      - name: Upload jar
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: chatping-${{ matrix.mc }}
          path: |
            versions/${{ matrix.mc }}/build/libs/*.jar
            !versions/${{ matrix.mc }}/build/libs/*-sources.jar
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 打 tag（v*）时把全部 jar 收拢成一个 GitHub Release。
  # ---------------------------------------------------------------------------
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: jars
          merge-multiple: true

      - name: List collected jars
        run: ls -la jars

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: jars/*.jar
          generate_release_notes: true
          draft: true
