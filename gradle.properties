# ---------------------------------------------------------------------------
# ChatPing 构建配置（全版本共用）
#
# MC 版本 / Fabric API 版本是「每个版本各一份」的，放在 versions/<MC版本>/gradle.properties。
# 这里只放所有版本都一样的东西。
# ---------------------------------------------------------------------------
mod_version=0.1.0-beta

# Fabric Loader：一个版本通吃所有 MC 版本
loader_version=0.16.10

# 只用于拼接产物文件名：chatping-<mod_version>-<MC版本>-<mod_loader>.jar
mod_loader=fabric

maven_group=dev.mewzica
archives_base_name=chatping

# 23 个版本各跑一次 Loom 很吃内存，给足一点
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
